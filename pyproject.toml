[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "set-quantai"
version = "0.1.0"
description = "Thai Equity Quantitative Analysis & Automated Trading System (SET-QuantAI)"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.9",
]
