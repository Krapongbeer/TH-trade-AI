[tool.poetry]
name = "set-quantai"
version = "0.1.0"
description = "Thai Equity Quantitative Analysis & Automated Trading System (SET-QuantAI)"
authors = ["Antigravity Quant Team <quant@antigravity.ai>"]
readme = "README.md"
packages = [{include = "set_quantai"}]

[tool.poetry.dependencies]
python = ">=3.11"
pydantic = ">=2.7.0"
pyyaml = ">=6.0"
rich = ">=13.7.0"
typer = ">=0.12.0"

[tool.poetry.scripts]
set-quantai = "set_quantai.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
