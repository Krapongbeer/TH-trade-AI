services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: set_quantai_timescaledb
    environment:
      POSTGRES_DB: set_quantai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quant_password
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./set_quantai/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d set_quantai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: set_quantai_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
  redis_data:
